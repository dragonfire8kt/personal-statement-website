name: Deploy static site to SMB share

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync website to production SMB share
        run: |
          $source = "${{ github.workspace }}\"
          $destination = "\\Domino\Home\www"

          if (-not (Test-Path $destination)) {
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
          }

          robocopy $source $destination /MIR /XD .git .github /XF .gitignore

          if ($LASTEXITCODE -ge 8) {
            throw "robocopy reported errors; exit code $LASTEXITCODE"
          }
