<!DOCTYPE html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="PersonalStatement.css">
    <title>Kaitlin Addis | Personal Statement</title>
</head>

<header> 
    <!--The links that should be shown in the navigation bar-->
    <!--Having current page in a span helps differentiate it from the rest of the links to class it more clearly and improve ease of styling-->
    <div class = 'navBar'>
            <span class="currentPage"><a href= "index.html" data-tooltip="Home Page">Home</a></span>
            <a href= "PersonalStatementQ1.html" data-tooltip="Why do you want to study this course or subject?">Question 1</a>
            <a href= "PersonalStatementQ2.html" data-tooltip="How have your qualifications and studies helped you to prepare for this course or subject?">Question 2</a>
            <a href= "PersonalStatementQ3.html" data-tooltip="What else have you done to prepare outside of education, and why are these experiences useful?">Question 3</a>
            <a href= "PersonalStatementGallery.html" data-tooltip="Photo Gallery">Photo Gallery</a>
            <a href= "PersonalStatementWebsiteProcess.html" data-tooltip="Why make a personal statement website?">Website Creation Process</a>
    </div>
</header>

<body>
    <!--Contains the text for the background carousel-->
    <div class="movingContent">
        <div class="homeContent">
            <span>Personal Statement | Computer Science | </span>
            <!--Ensures that there is no gap when the first line of the carousel text ends-->
            <!--aria-hidden="True" prevents accessibility readers from reading the carousel text twice-->
            <span aria-hidden="True">Personal Statement | Computer Science | </span>
        </div>
    </div>
</body>

<footer>
    <!--Creates input box, submit button, prompt etc in the footer of the page to give feedback on the website-->
    <!--Including in a form tag means that the user pressing enter will have the same effect as clicking the button-->
    <form>
        Like the website? Leave a review!
        <input type="text" name="review" placeholder="Leave Your Review Here" style="margin: 10px;">
        <button onclick="sendReview()" action="PersonalStatementReviews.html" style="margin:10px;">Send</button>
    </form>
    <!--Adds my name to remind people that this is who they are sending feedback to and who created the website as well as providing opportunity for the GitHub link-->
    <a href="https://github.com/dragonfire8kt/personal-statement-website" class="signOff">Kaitlin Addis</a>
</footer>

<script type="text/javascript" src="PersonalStatement.js"></script>
