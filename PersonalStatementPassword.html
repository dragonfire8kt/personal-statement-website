<!DOCTYPE html>

<html lang="en">

	<head>
		<meta charset="UTF-8">
		<!--The viewport is the visible area of the web page on a device, the line below sets the width to the device width and the initial scale to 1.0-->
	    <meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="keywords" content="HTML, CSS, JavaScript, Personal Statement, Computer Science, University, Higher Education, Website, Kaitlin Addis">
	    <meta name="description" content="A Personal Statement website, which includes one candidate's responses to the three questions of the Personal Statement along with accompanying images and an explanation of how and why the website was created.">
	    <meta name="author" content="Kaitlin Addis">
		<!--I quickly created this icon using the Paint app. Although it is rough and simple, I like the design and feel that it suits the website. Using my own favicon makes the website seem more professional and complete.-->
		<link rel="icon" type="image/png" href="images/favicon.png" sizes="32x32">
		<link rel="stylesheet" href="PersonalStatement.css">
	    <title>Kaitlin Addis | Personal Statement</title>
	    <script type="text/javascript" src="PersonalStatement.js" defer></script>
	</head>

	<body>

	    <main>
	        <!--Creates password input box, prompt and button to submit-->
	        <div class="centraliser">
	            <div class="container">
	                <!--Including in a form tag means that the user pressing enter will have the same effect as clicking the button-->
	                <!--return false; means that the the website is not allowed to complete the functions usually completed on submission of a form (including reloading the page) and instead only runs the enter() function-->
	                <!--This prevents the issue of the form reloading the page before the enter() function has completed, as this caused it to never redirect to index.html-->
	                <!--The return false; directly below is there for when the user submits the form by pressing the enter key or through means other than pressing the button-->
	                <form onsubmit="enter(); return false;">
	                    <!--Using type="password" hides the input-->
	                    <input id="sitePassword" type="password" name="password" placeholder="Enter the password here" style="margin:5px;">
	                    <!--The return false; directly below is there for when the user submits the form by pressing the submit button-->
	                    <button type="button" onclick="enter(); return false;" style="margin:5px;">Submit</button>
	                </form>
	            </div>
	        </div>
	    </main>

	    <!--Contains the text for the background carousel-->
	    <div class="movingContent">
	        <div class="homeContent">
	            <span>Personal Statement | Kaitlin Addis | Computer Science | </span>
	            <!--Ensures that there is no gap when the first line of the carousel text ends-->
	            <!--aria-hidden="True" prevents accessibility readers from reading the carousel text twice-->
	            <span aria-hidden="True">Personal Statement | Kaitlin Addis | Computer Science | </span>
	        </div>
	    </div>

	</body>
    
</html>
