<!DOCTYPE html>

<head>
    <link rel="stylesheet" href="PersonalStatement.css">
    <title>Kaitlin Addis | Personal Statement</title>
</head>

<body>
    <!--Creates password input box, prompt and button to submit-->
    <div class="centraliser">
        <div class="container">
            <!--Including in a form tag means that the user pressing enter will have the same effect as clicking the button-->
            <form>
            <input id="sitePassword" type="text" name="password" placeholder="Enter the password here" style="margin:5px;">
            <button onclick="enter()" style="margin:5px;">Submit</button>
            </form>
        </div>
    </div>

    <!--Contains the text for the background carousel-->
    <div class="movingContent">
        <div class="homeContent">
            <span>Personal Statement | Kaitlin Addis | Computer Science | </span>
            <!--Ensures that there is no gap when the first line of the carousel text ends-->
            <!--aria-hidden="True" prevents accessibility readers from reading the carousel text twice-->
            <span aria-hidden="True">Personal Statement | Kaitlin Addis | Computer Science | </span>
        </div>
    </div>
    </div>
</body>

<script type="text/javascript" src="PersonalStatement.js"></script>
